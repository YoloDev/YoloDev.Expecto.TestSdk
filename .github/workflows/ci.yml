name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Expecto ${{ matrix.expecto }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        expecto:
          - "10"
          - "11"
        include:
          - expecto: "10"
            expecto_version: 10.2.3
          - expecto: "11"
            expecto_version: 11.0.0
          - expecto: "10"
            os: ubuntu-latest
            publish: true

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      EXPECTO_VERSION: ${{ matrix.expecto_version }}

    steps:
      - name: ⏬ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔽 Setup dotnet from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8

      - name: 🔽 Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: 🔍 Print dotnet info
        run: dotnet --info

      - name: 🧪 Test
        run: just test

      - name: 🔼 Upload packages as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.publish == true }}
        with:
          name: nuget
          path: artifacts/nuget/

      - name: 🔼 Upload global.json as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.publish == true }}
        with:
          name: global-json
          path: global.json
